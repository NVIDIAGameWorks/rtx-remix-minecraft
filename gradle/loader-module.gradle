apply from: rootProject.file('packaging/runtime-payload.gradle')

def state = gradle.ext.targetState
def modulePath = rootProject.relativePath(project.projectDir).replace('\\', '/')
def loaderEntry = state.loaders.find { loaderId, candidate ->
    candidate.projectPath == project.path && candidate.module == modulePath
}
if (loaderEntry == null) {
    throw new GradleException(
            "Project ${project.path} at ${modulePath} has no matching loader declaration " +
            'in project-state.json')
}
def loader = loaderEntry.value
def minecraftModule = state.minecraft.module
if (!minecraftModule || !rootProject.file(minecraftModule).directory) {
    throw new GradleException(
            "Minecraft ${state.minecraft.version} module '${minecraftModule}' is missing")
}

ext.loaderState = loader
ext.minecraftVersion = state.minecraft.version
ext.javaTarget = state.minecraft.javaTarget.intValue()
ext.repoRoot = rootProject.projectDir
ext.buildArches = rootProject.ext.sharedBuildArches
ext.archProperty = rootProject.ext.sharedArchProperty
ext.resolvedBuildVersion = rootProject.ext.sharedBuildVersion

group = state.mod.group
version = rootProject.version

base {
    archivesName = loader.archiveBaseName
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaTarget)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir rootProject.file("${minecraftModule}/main/java")
            srcDir rootProject.file('renderer-core/src')
            srcDir rootProject.file('rtxremix-java/src')
        }
        resources {
            srcDir rootProject.file("${minecraftModule}/main/resources")
            srcDir rootProject.file('renderer-core/main/resources')
        }
    }
    test {
        java {
            srcDir rootProject.file("${minecraftModule}/test/java")
            srcDir rootProject.file('renderer-core/test')
        }
        resources {
            srcDir rootProject.file("${minecraftModule}/test/resources")
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaTarget
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir = repoRoot
    // Keep terrain publication tests independent of the runner's CPU count.
    systemProperty 'rtxremix.chunk.maxInstalledColumnsPerFrame', '8'
}

// Compiling a runnable target must also leave the native bridge and pinned
// runtime ready for the authenticated launcher workflow.
tasks.named('classes') {
    dependsOn ':setupRuntime'
}

def migrateDevelopmentResourcePacksTask =
        tasks.register('migrateDevelopmentResourcePacks', Exec) {
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', rootProject.file('packaging/migrate_resource_packs.ps1').absolutePath,
            '-McDir', rootProject.file('run').absolutePath,
            '-LegacyPackName', 'rtx-remix',
            '-MinecraftVersion', minecraftVersion,
            '-ModLoader', loader.displayName
}

// Keep the loader plugins' standard development task usable without making it
// part of the authenticated Prism-based tooling workflow.
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn migrateDevelopmentResourcePacksTask
}

def gitShortHash = providers.exec {
    commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
}.standardOutput.asText.map { it.trim() }
def gitBranch = providers.exec {
    commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
}.standardOutput.asText.map { it.trim() }

processResources {
    exclude 'README.md'
    inputs.property 'modVersion', resolvedBuildVersion
    inputs.property 'minecraftVersion', minecraftVersion
    inputs.property 'javaTarget', javaTarget
    inputs.property 'loaderVersion', loader.loader.version
    inputs.property 'loaderVersionRange', loader.loader.versionRange
    inputs.property 'gitShortHash', gitShortHash
    inputs.property 'gitBranch', gitBranch

    filesMatching(loader.metadataFile) {
        expand(
                version: resolvedBuildVersion,
                minecraftVersion: minecraftVersion,
                minecraftVersionRange: state.minecraft.versionRange,
                javaTarget: javaTarget,
                loaderVersion: loader.loader.version,
                loaderVersionRange: loader.loader.versionRange,
                apiVersion: loader.api?.version,
                apiVersionRange: loader.api?.versionRange,
                file: [jarVersion: '${file.jarVersion}'])
    }
    filesMatching('benchmark.properties') {
        expand 'gitCommit': gitShortHash.get(), 'gitBranch': gitBranch.get()
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${loader.archiveBaseName}" }
    }
    from(rootProject.file('NOTICE')) {
        rename { "${it}_${loader.archiveBaseName}" }
    }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        rename { "THIRD_PARTY_NOTICES_${loader.archiveBaseName}.md" }
    }
}

def packageSourceTask = tasks.named(loader.packageSourceTask)
def packageJarTasks = buildArches.collectEntries { arch ->
    def taskSuffix = arch == 'win64' ? 'Win64' : 'Arm64'
    [(arch): tasks.register("packageJar${taskSuffix}", Zip) {
        description = "Assembles the ${loader.displayName} ${arch} distributable JAR"
        group = 'build'
        dependsOn packageSourceTask
        dependsOn arch == 'win64' ? ':fetchRuntimeSdkWin64' : ':fetchRuntimeSdkArm64'
        dependsOn arch == 'win64' ? ':compileNativeWin64' : ':compileNativeArm64'
        dependsOn ':fetchRuntimeTextures'

        archiveFileName.set(runtimeArtifactFileName(
                loader.packagedArtifact.pattern,
                state.mod.version,
                state.minecraft.version,
                arch))
        destinationDirectory.set(layout.buildDirectory.dir('distributions'))
        configureReproducibleRuntimeArchive(delegate)

        from({ zipTree(packageSourceTask.get().archiveFile.get().asFile) })
        with runtimePayloadSpec(repoRoot, [arch])
    }]
}

def packageJarTask = tasks.register('packageJar') {
    description = "Assembles the selected ${loader.displayName} architecture JARs"
    group = 'build'
    dependsOn packageJarTasks.values()
}

def packageJarArchives = packageJarTasks.collectEntries { arch, task ->
    [(arch): task.flatMap { it.archiveFile }]
}
def verifyPackageJarTasks = packageJarArchives.collectEntries { arch, archive ->
    def taskSuffix = arch == 'win64' ? 'Win64' : 'Arm64'
    [(arch): tasks.register("verifyPackageJar${taskSuffix}") {
        description = "Verifies the ${loader.displayName} ${arch} distributable runtime payload"
        group = 'verification'
        dependsOn packageJarTasks[arch]
        inputs.file(archive)
        inputs.dir(rootProject.file('packaging/rtx-remix'))
        inputs.dir(rootProject.file('packaging/licenses'))

        doLast {
            verifyRuntimePayloadArchive(
                    archive.get().asFile, repoRoot, [arch], [loader.metadataFile])
        }
    }]
}
def verifyPackageJarTask = tasks.register('verifyPackageJar') {
    description = "Verifies the selected ${loader.displayName} architecture JARs"
    group = 'verification'
    dependsOn verifyPackageJarTasks.values()
}

def installerThinJarTask = tasks.register('installerThinJar', Zip) {
    description = "Assembles the ${loader.displayName} installer component without a runtime"
    group = 'build'
    dependsOn packageSourceTask
    archiveFileName.set(
            "${state.mod.id}-${state.mod.version}-mc${state.minecraft.version}-" +
            "${loaderEntry.key}-thin.jar")
    destinationDirectory.set(layout.buildDirectory.dir('installer-components'))
    configureReproducibleRuntimeArchive(delegate)
    from({ zipTree(packageSourceTask.get().archiveFile.get().asFile) })
}
def installerThinJarArchive = installerThinJarTask.flatMap { it.archiveFile }
def verifyInstallerThinJarTask = tasks.register('verifyInstallerThinJar') {
    description = "Verifies the ${loader.displayName} installer component"
    group = 'verification'
    dependsOn installerThinJarTask
    inputs.file(installerThinJarArchive)

    doLast {
        def zip = new java.util.zip.ZipFile(installerThinJarArchive.get().asFile)
        try {
            if (zip.getEntry(loader.metadataFile) == null) {
                throw new GradleException(
                        "${loader.displayName} installer component is missing ${loader.metadataFile}")
            }
            def nativeEntry = java.util.Collections.list(zip.entries()).find {
                it.name == 'native' || it.name.startsWith('native/')
            }
            if (nativeEntry != null) {
                throw new GradleException(
                        "${loader.displayName} installer component unexpectedly contains ${nativeEntry.name}")
            }
        } finally {
            zip.close()
        }
    }
}

ext.packageJarArchives = packageJarArchives
ext.verifyPackageJarTasks = verifyPackageJarTasks
ext.verifyPackageJarTask = verifyPackageJarTask
ext.installerThinJarArchive = installerThinJarArchive
ext.verifyInstallerThinJarTask = verifyInstallerThinJarTask

tasks.register('package') {
    description = "Builds and verifies the ${loader.displayName} distributable"
    group = 'build'
    dependsOn 'build', verifyPackageJarTask
}
